[pytest]
# Local pytest configuration for the security-audit test suite.
#
# The repo root has a top-level ``__init__.py`` that eagerly imports the
# whole codebase (which depends on game modules that import each other
# through implicit paths). Running pytest from the repo root would
# collect the root ``__init__.py`` as a package and fail to import.
#
# We override that by placing this pytest.ini *inside* the ``tests/``
# directory so pytest treats ``tests/`` as the rootdir. Combined with
# ``--import-mode=importlib`` we get clean test discovery without
# touching the repo's existing package layout.
#
# Run with:
#   cd tests && python -m pytest .
# or, from anywhere:
#   python -m pytest tests/
addopts = --import-mode=importlib
testpaths = .
