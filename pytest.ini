[pytest]
# Wave 3: scope pytest collection to ``tests/`` and stop conftest discovery at
# that directory so pytest never tries to import the repo-root ``__init__.py``
# (which transitively pulls in legacy game modules that do not load on modern
# Python). ``importlib`` import mode is required to avoid the rootdir walk.
testpaths = tests
addopts = --import-mode=importlib -p no:cacheprovider --confcutdir=tests --rootdir=tests
norecursedirs = src test .git __pycache__
