name: Security audit

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  audit:
    name: STIG / NIST compliance tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run compliance + regression tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Bandit (informational, does not fail build)
        continue-on-error: true
        run: |
          bandit -q -r src/ test/ -x .venv -f txt || true
